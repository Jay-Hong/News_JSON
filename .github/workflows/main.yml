name:  News

on: # [push]
  workflow_dispatch:
  schedule:
    # 매일 06, 11, 16, 21 시 16분 전 (UTC+9) [UTC기준 매일 21, 02, 07, 12 시 16분 전]
    - cron: '44 01,06,11,20 * * *'
    # - cron: '55 23 31 2 6'	# 실행되지 않아야 하지만 ➡️ GitHub에서 2월중 토요일(6) 실행됨 / 마지막 * 면 계속 실행됨

concurrency:
  group: news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        # 개인 토큰을 사용할 것인지 말 것인지
        persist-credentials: false
    - name: requirements
      timeout-minutes: 5
      run: |
        python -m pip install -r nate_news/requirements.txt
        python -m pip check
    - name: Execution
      id: execution
      run: |
        git pull
        if [ -f nate_result.json ]; then rm -f nate_result.json; fi
        if [ -f crawl_metrics.json ]; then rm -f crawl_metrics.json; fi
        scrapy crawl nate_news_rank
        python3 validate_result.py nate_result.json crawl_metrics.json
        cp -fp nate_result.json ../newsURL.json
      working-directory: ./nate_news
    - name: Network diagnostics
      # Only when the Execution step failed (git pull, crawl, validation, or
      # copy), so a dependency-install failure never sends extra requests to
      # Nate. No `-e`: every probe runs even if an earlier one fails, and the
      # job is already failing anyway.
      if: failure() && steps.execution.outcome == 'failure'
      timeout-minutes: 2
      working-directory: ./nate_news
      shell: bash {0}
      run: |
        url="https://m.news.nate.com/rank/list?page=1"
        ua="$(python3 -c 'from nate_news.settings import USER_AGENT; print(USER_AGENT)')"
        fmt='code=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n'
        echo "nate probe start: $(date -u +%FT%TZ)"
        curl -sS -o /dev/null --http1.1 --max-time 20 -A "$ua" -w "nate: $fmt" "$url"
        echo "nate curl exit=$? end: $(date -u +%FT%TZ)"
        curl -sS -o /dev/null --max-time 20 -w "github (control): $fmt" https://github.com
        echo "github curl exit=$?"
        timeout 10 getent hosts m.news.nate.com
        echo "getent exit=$?"
        echo "runner public IP: $(curl -sS --max-time 5 https://checkip.amazonaws.com)"
        if [ -f crawl_metrics.json ]; then
          python3 -c 'import json; m = json.load(open("crawl_metrics.json")); print({k: m.get(k) for k in ("close_reason", "rank_pages_completed", "articles_discovered", "article_items_yielded", "article_failures", "max_consecutive_transport_failures", "transport_failure_limit")})'
        fi
    - name: Commit files
      run: |
        git config --local user.email "hjpyooo@gmail.com"
        git config --local user.name "Jay"
        if git diff --quiet -- nate_news/nate_result.json newsURL.json; then
          echo "Nothing to commit, working tree clean"
        else
          git add nate_news/nate_result.json newsURL.json
          git commit -m "News"
        fi
        git pull --rebase
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
